# yaml-language-server: $schema=https://schema.blue-build.org/module-v1.json
type: script

scripts:
  - name: "Install wayland-spice-clipboard-fix"
    commands:
      - |
        git clone https://github.com/chrisbelson/wayland-spice-clipboard-fix.git /tmp/spice-fix
        cd /tmp/spice-fix
        git checkout 7c4ca50
        mkdir -p /usr/local/libexec
        cp scripts/wayland-spice-clipboard /usr/local/libexec/
        chmod +x /usr/local/libexec/wayland-spice-clipboard
        mkdir -p /etc/skel/.config/systemd/user
        cp systemd/wayland-spice-clipboard.service /etc/skel/.config/systemd/user/
        mkdir -p /etc/skel/.config/systemd/user/default.target.wants
        ln -sf /etc/skel/.config/systemd/user/wayland-spice-clipboard.service /etc/skel/.config/systemd/user/default.target.wants/
        cd /
        rm -rf /tmp/spice-fix
